<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Pisos</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>
<style>
:root{--bg:#0f0f13;--surface:#18181f;--surface2:#1f1f2a;--border:#2a2a38;--accent:#7c6af7;--accent2:#f7c46a;--accent3:#6af7b8;--danger:#f76a6a;--text:#e8e8f0;--text2:#8888a8;--radius:12px;--radius-lg:18px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;max-width:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
#authScreen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 30px;width:100%;max-width:360px;}
.auth-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;margin-bottom:4px;text-align:center;}
.auth-logo span{color:var(--accent);}
.auth-sub{font-size:12px;color:var(--text2);text-align:center;margin-bottom:28px;}
.auth-error{color:var(--danger);font-size:12px;min-height:18px;margin-top:8px;text-align:center;}
.app{display:flex;min-height:100vh;}
.main{flex:1;padding:28px;min-width:0;max-width:100%;}
.page{display:none;}.page.active{display:block;}
.sidebar{width:220px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;}
.sidebar-logo{padding:24px 20px 18px;border-bottom:1px solid var(--border);}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.5px;}
.logo-text span{color:var(--accent);}
.logo-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.sidebar-nav{padding:14px 10px;flex:1;overflow-y:auto;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);padding:0 10px;margin:14px 0 5px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px;transition:all .15s;margin-bottom:2px;font-weight:500;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:rgba(124,106,247,.15);color:var(--accent);}
.nav-item .icon{font-size:16px;width:20px;text-align:center;}
.sidebar-footer{padding:14px;border-top:1px solid var(--border);}
.piso-badge{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;}
.piso-badge .piso-name{font-weight:600;color:var(--text);font-family:'Syne',sans-serif;}
.piso-badge .piso-addr{color:var(--text2);font-size:11px;margin-top:2px;}
.user-badge{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
.user-email{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:12px;flex-wrap:wrap;}
.page-title{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.5px;}
.page-sub{color:var(--text2);font-size:13px;margin-top:3px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:#6a58e0;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:rgba(247,106,106,.15);color:var(--danger);border:1px solid rgba(247,106,106,.3);}.btn-danger:hover{background:rgba(247,106,106,.25);}
.btn-sm{padding:6px 12px;font-size:12px;}.btn-icon{padding:7px;}.btn:disabled{opacity:.5;cursor:not-allowed;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;transition:border-color .15s;}
.card:hover{border-color:var(--accent);}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;}
.card-actions{display:flex;gap:6px;flex-shrink:0;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;}
.badge-libre{background:rgba(106,247,184,.12);color:var(--accent3);border:1px solid rgba(106,247,184,.25);}
.badge-ocupada{background:rgba(247,196,106,.12);color:var(--accent2);border:1px solid rgba(247,196,106,.25);}
.badge-reservada{background:rgba(124,106,247,.12);color:var(--accent);border:1px solid rgba(124,106,247,.25);}
.badge-mantenimiento{background:rgba(247,106,106,.12);color:var(--danger);border:1px solid rgba(247,106,106,.25);}
.badge-activo{background:rgba(106,247,184,.12);color:var(--accent3);border:1px solid rgba(106,247,184,.25);}
.badge-moroso{background:rgba(247,106,106,.12);color:var(--danger);border:1px solid rgba(247,106,106,.25);}
.badge-pasado{background:rgba(136,136,168,.12);color:var(--text2);border:1px solid var(--border);}
.badge-pagado{background:rgba(106,247,184,.12);color:var(--accent3);border:1px solid rgba(106,247,184,.25);}
.badge-pendiente{background:rgba(247,196,106,.12);color:var(--accent2);border:1px solid rgba(247,196,106,.25);}
.badge-impagado{background:rgba(247,106,106,.12);color:var(--danger);border:1px solid rgba(247,106,106,.25);}
.badge-vigente{background:rgba(106,247,184,.12);color:var(--accent3);border:1px solid rgba(106,247,184,.25);}
.badge-finalizado{background:rgba(136,136,168,.12);color:var(--text2);border:1px solid var(--border);}
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px;margin-bottom:22px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;}
.stat-value{font-family:'Syne',sans-serif;font-size:25px;font-weight:800;line-height:1;}
.stat-label{color:var(--text2);font-size:12px;margin-top:4px;}
.stat-accent{color:var(--accent);}.stat-green{color:var(--accent3);}.stat-yellow{color:var(--accent2);}.stat-red{color:var(--danger);}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--surface2);}
th{padding:11px 13px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);font-weight:600;white-space:nowrap;}
td{padding:11px 13px;border-top:1px solid var(--border);font-size:13px;}
tr:hover td{background:rgba(124,106,247,.04);}
.mob-list{display:none;}
.mob-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.mob-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;}
.mob-card-name{font-weight:700;font-size:14px;}
.mob-card-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.mob-card-rows{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.mob-card-pill{background:var(--surface2);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--text2);}
.mob-card-pill strong{color:var(--text);}
.mob-card-actions{display:flex;gap:8px;flex-wrap:wrap;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);z-index:1000;align-items:flex-start;justify-content:center;padding:20px 12px 80px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;width:100%;max-width:500px;animation:slideUp .2s ease;margin:auto 0;}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;margin-bottom:16px;}
.form-group{margin-bottom:13px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;}.form-row>*{min-width:0;}
label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
input,select,textarea{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .15s;}
input[type=date],input[type=month]{appearance:none;-webkit-appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:var(--surface2);}
textarea{resize:vertical;min-height:68px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;border-top:1px solid var(--border);padding-top:16px;flex-wrap:wrap;}
.room-detail-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.room-detail-row:last-child{border-bottom:none;}
.room-detail-label{color:var(--text2);}
.room-detail-value{font-weight:500;}
.equip-tags{display:flex;flex-wrap:wrap;gap:5px;}
.equip-tag{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--text2);}
.filters{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
.filters::-webkit-scrollbar{display:none;}
.filter-btn{padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.filter-btn:hover,.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.empty{text-align:center;padding:44px 20px;color:var(--text2);}
.empty-icon{font-size:34px;margin-bottom:9px;}
.empty-title{font-family:'Syne',sans-serif;font-size:15px;color:var(--text);margin-bottom:5px;}
.toast{position:fixed;bottom:76px;right:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 15px;font-size:13px;z-index:9999;transform:translateY(16px);opacity:0;transition:all .28s;box-shadow:0 6px 24px rgba(0,0,0,.5);}
.toast.show{transform:none;opacity:1;}
.toast.success{border-color:var(--accent3);}.toast.error{border-color:var(--danger);}
#loadingOverlay{position:fixed;inset:0;background:var(--bg);z-index:8000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
#loadingOverlay.hidden{display:none;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text2);}
.sync-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text2);margin-bottom:18px;flex-wrap:wrap;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text2);flex-shrink:0;}
.sync-dot.ok{background:var(--accent3);}.sync-dot.err{background:var(--danger);}.sync-dot.pulse{background:var(--accent2);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.cfg-tabs{display:flex;gap:0;margin-bottom:22px;border-bottom:1px solid var(--border);}
.cfg-tab{padding:10px 20px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s;font-family:'DM Sans',sans-serif;background:none;border-top:none;border-left:none;border-right:none;}
.cfg-tab:hover{color:var(--text);}
.cfg-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.cfg-panel{display:none;}.cfg-panel.active{display:block;}
.cfg-header{display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;}
.cfg-btn{flex-shrink:0;white-space:nowrap;}
.gastos-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;}
.gastos-tab{padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s;font-family:'DM Sans',sans-serif;background:none;border-top:none;border-left:none;border-right:none;}
.gastos-tab:hover{color:var(--text);}
.gastos-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.gastos-panel{display:none;}.gastos-panel.active{display:block;}
.gantt-wrap{overflow-x:auto;margin-top:10px;}
.gantt-svg{display:block;}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:200;height:60px;}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text2);font-size:10px;font-family:'DM Sans',sans-serif;font-weight:500;padding:4px 1px;transition:color .15s;border:none;background:none;}
.bottom-nav-item .bn-icon{font-size:18px;line-height:1.1;}
.bottom-nav-item.active{color:var(--accent);}
@media(min-width:769px){.sidebar{display:flex;}.main{margin-left:220px;}.bottom-nav{display:none!important;}.table-wrap{display:block;}.mob-list{display:none!important;}}
@media(max-width:768px){.sidebar{display:none!important;}.main{margin-left:0;padding:12px 12px 76px;}.bottom-nav{display:flex;}.table-wrap{display:none!important;}.mob-list{display:block!important;}.topbar{flex-direction:column;gap:8px;margin-bottom:16px;}.topbar .btn{width:100%;justify-content:center;}.page-title{font-size:19px;}.cards-grid{grid-template-columns:1fr;}.stats-row{grid-template-columns:1fr 1fr;gap:8px;}.stat-card{padding:11px 12px;}.stat-value{font-size:20px;}.form-row{grid-template-columns:1fr;}.modal{padding:16px 13px;}.modal-footer{justify-content:stretch;}.modal-footer .btn{flex:1;justify-content:center;}.cfg-header{flex-direction:row!important;}.cfg-btn{width:auto!important;}}
.divider{height:1px;background:var(--border);margin:18px 0;}
.flex{display:flex;}.gap-2{gap:8px;}.items-center{align-items:center;}.justify-between{justify-content:space-between;}
.mt-2{margin-top:8px;}.mb-3{margin-bottom:12px;}.font-bold{font-weight:700;}
.text-accent{color:var(--accent);}.text-green{color:var(--accent3);}.text-yellow{color:var(--accent2);}.text-red{color:var(--danger);}.text-muted{color:var(--text2);}.text-sm{font-size:12px;}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div class="loading-text">Conectando…</div></div>
<div id="authScreen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">Gestión <span>Pisos</span></div>
    <div class="auth-sub">Accede con tu cuenta</div>
    <div class="form-group"><label>Email</label><input type="email" id="authEmail" placeholder="tu@email.com" autocomplete="email"></div>
    <div class="form-group"><label>Contraseña</label><input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <input type="checkbox" id="authRemember" checked style="width:auto;accent-color:var(--accent)">
      <label for="authRemember" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--text2);cursor:pointer">Recordar sesión</label>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" id="authBtn" onclick="doLogin()">Entrar</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>
<div class="app" id="mainApp" style="display:none">
<aside class="sidebar">
  <div class="sidebar-logo"><div class="logo-text">Gestión <span>Pisos</span></div><div class="logo-sub">Panel de gestión</div></div>
  <nav class="sidebar-nav">
    <div class="nav-label">Principal</div>
    <div class="nav-item active" onclick="showPage('dashboard')"><span class="icon">📊</span><span>Dashboard</span></div>
    <div class="nav-label">Gestión</div>
    <div class="nav-item" onclick="showPage('habitaciones')"><span class="icon">🏠</span><span>Habitaciones</span></div>
    <div class="nav-item" onclick="showPage('inquilinos')"><span class="icon">👤</span><span>Inquilinos</span></div>
    <div class="nav-item" onclick="showPage('contratos')"><span class="icon">📄</span><span>Contratos</span></div>
    <div class="nav-item" onclick="showPage('cobros')"><span class="icon">💸</span><span>Cobros</span></div>
    <div class="nav-item" onclick="showPage('gastos')"><span class="icon">⚡</span><span>Gastos</span></div>
  </nav>
  <div class="sidebar-footer">
    <div class="piso-badge" id="sidebarPiso"><div class="piso-name">—</div><div class="piso-addr">Sin inmueble</div></div>
    <div class="user-badge"><span class="user-email" id="userEmail"></span><button class="btn btn-secondary btn-sm" onclick="doLogout()" title="Cerrar sesión">↪</button></div>
    <div style="margin-top:8px"><button class="btn btn-secondary btn-sm" style="width:100%;justify-content:center" onclick="showPage('configurar')">⚙️ Configurar</button></div>
  </div>
</aside>
<main class="main">
<div class="page active" id="page-dashboard">
  <div class="topbar"><div><div class="page-title">Dashboard</div><div class="page-sub">Resumen de tu propiedad</div><div class="current-piso-name" style="font-size:12px;color:var(--accent);margin-top:2px;font-weight:600"></div></div><button class="btn btn-secondary" onclick="showPage('configurar')">⚙️ Configurar</button></div>
  <div class="sync-bar"><div class="sync-dot" id="syncDot"></div><span id="syncMsg">—</span><button class="btn btn-secondary btn-sm" id="btnRefresh" style="margin-left:auto" onclick="loadAllData()">🔄 Actualizar</button></div>
  <div class="stats-row" id="dashboardStats"></div>
  <div class="cards-grid" id="dashboardHabs"></div>
</div>
<div class="page" id="page-habitaciones">
  <div class="topbar"><div><div class="page-title">Habitaciones</div><div class="page-sub">Gestión del inmueble</div><div class="current-piso-name" style="font-size:12px;color:var(--accent);margin-top:2px;font-weight:600"></div></div><button class="btn btn-primary" onclick="openModalHab()">+ Nueva</button></div>
  <div id="pisoInfo" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;font-size:13px"></div>
  <div class="filters"><button class="filter-btn active" onclick="filterHabs('todas',this)">Todas</button><button class="filter-btn" onclick="filterHabs('libre',this)">Libres</button><button class="filter-btn" onclick="filterHabs('ocupada',this)">Ocupadas</button><button class="filter-btn" onclick="filterHabs('reservada',this)">Reservadas</button><button class="filter-btn" onclick="filterHabs('mantenimiento',this)">Mantenimiento</button></div>
  <div class="cards-grid" id="habsGrid"></div>
</div>
<div class="page" id="page-inquilinos">
  <div class="topbar"><div><div class="page-title">Inquilinos</div><div class="page-sub">Registro de arrendatarios</div><div class="current-piso-name" style="font-size:12px;color:var(--accent);margin-top:2px;font-weight:600"></div></div><button class="btn btn-primary" onclick="openModalInquilino()">+ Nuevo</button></div>
  <div class="filters"><button class="filter-btn active" onclick="filterInquilinos('todos',this)">Todos</button><button class="filter-btn" onclick="filterInquilinos('activo',this)">Activos</button><button class="filter-btn" onclick="filterInquilinos('moroso',this)">Morosos</button><button class="filter-btn" onclick="filterInquilinos('pasado',this)">Pasados</button></div>
  <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>DNI/NIE</th><th>Habitación</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="inquilinosTable"></tbody></table></div>
  <div class="mob-list" id="inquilinosMob"></div>
</div>
<div class="page" id="page-contratos">
  <div class="topbar"><div><div class="page-title">Contratos</div><div class="page-sub">Contratos de arrendamiento</div><div class="current-piso-name" style="font-size:12px;color:var(--accent);margin-top:2px;font-weight:600"></div></div><button class="btn btn-primary" onclick="openModalContrato()">+ Nuevo</button></div>
  <div class="filters"><button class="filter-btn active" onclick="filterContratos('todos',this)">Todos</button><button class="filter-btn" onclick="filterContratos('vigente',this)">Vigentes</button><button class="filter-btn" onclick="filterContratos('finalizado',this)">Finalizados</button></div>
  <div class="table-wrap"><table><thead><tr><th>Inquilino</th><th>Habitación</th><th>Inicio</th><th>Fin</th><th>Renta</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="contratosTable"></tbody></table></div>
  <div class="mob-list" id="contratosMob"></div>

<script>
const SUPABASE_URL  = 'https://nrfojecuxecjfywnsszc.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yZm9qZWN1eGVjamZ5d25zc3pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3ODkwOTUsImV4cCI6MjA5NTM2NTA5NX0.r_4MedC2I1HFc9i6USNO1f7A0Xuv02HU1bf8G5Zh4ks';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

let STATE = {
  user: null, empresa: 'Mi empresa',
  pisos: [], currentPisoId: null,
  habitaciones: [], inquilinos: [], contratos: [],
  cobros: [], gastos: [], historicoGastos: [], tiposSupl: []
};

const SUML_DEFAULTS = [
  {nombre:'Luz',icono:'💡',color:'#f7c46a'},{nombre:'Agua',icono:'💧',color:'#6af7f7'},
  {nombre:'Gas',icono:'🔥',color:'#f7956a'},{nombre:'Internet',icono:'🌐',color:'#7c6af7'},
  {nombre:'Comunidad',icono:'🏢',color:'#a8a8c8'},{nombre:'Otros',icono:'📦',color:'#6af7b8'}
];

const v   = id => document.getElementById(id)?.value ?? '';
const cap = s  => s ? s.charAt(0).toUpperCase()+s.slice(1) : '';
const fmt = n  => Number(n||0).toLocaleString('es',{minimumFractionDigits:0,maximumFractionDigits:2});
const fmtD= d  => { if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('es',{day:'2-digit',month:'2-digit',year:'numeric'}); };
function getSuml(nombre){ return STATE.tiposSupl.find(s=>s.nombre===nombre)||{icono:'📦',color:'#8888a8',nombre}; }

function toast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=(type==='success'?'✅ ':'❌ ')+msg;
  t.className='toast show '+type;
  setTimeout(()=>t.className='toast',2800);
}
function setSyncStatus(type,msg){
  const dot=document.getElementById('syncDot'),txt=document.getElementById('syncMsg');
  if(!dot||!txt)return;
  dot.className='sync-dot'+(type==='ok'?' ok':type==='err'?' err':type==='loading'?' pulse':'');
  txt.textContent=msg;
}
function loading(show,msg='Cargando…'){
  const el=document.getElementById('loadingOverlay');if(!el)return;
  el.classList.toggle('hidden',!show);
  const lt=el.querySelector('.loading-text');if(lt)lt.textContent=msg;
}

// AUTH
async function doLogin(){
  const email=v('authEmail').trim(),password=v('authPassword');
  const remember=document.getElementById('authRemember')?.checked;
  const errEl=document.getElementById('authError'),btn=document.getElementById('authBtn');
  if(!email||!password){errEl.textContent='Completa email y contrasena';return;}
  btn.disabled=true;btn.textContent='Entrando…';errEl.textContent='';
  const{data,error}=await sb.auth.signInWithPassword({email,password});
  btn.disabled=false;btn.textContent='Entrar';
  if(error){errEl.textContent=error.message;return;}
  if(!remember) window.addEventListener('beforeunload',()=>sb.auth.signOut(),{once:true});
  STATE.user=data.user;
  bootApp();
}
async function doLogout(){
  await sb.auth.signOut();
  STATE={user:null,empresa:'Mi empresa',pisos:[],currentPisoId:null,habitaciones:[],inquilinos:[],contratos:[],cobros:[],gastos:[],historicoGastos:[],tiposSupl:[]};
  document.getElementById('mainApp').style.display='none';
  document.getElementById('authScreen').style.display='flex';
  document.getElementById('authError').textContent='';
  document.getElementById('authEmail').value='';
  document.getElementById('authPassword').value='';
}

// BOOT
async function bootApp(){
  loading(true,'Cargando datos…');
  document.getElementById('authScreen').style.display='none';
  document.getElementById('mainApp').style.display='flex';
  document.getElementById('userEmail').textContent=STATE.user?.email||'';
  STATE.currentPisoId=localStorage.getItem('currentPisoId_'+STATE.user.id)||null;
  // Cargar preferencias de empresa desde Supabase
  const{data:prefs}=await sb.from('user_prefs').select('empresa,current_piso_id').eq('user_id',STATE.user.id).maybeSingle();
  if(prefs){
    if(prefs.empresa) STATE.empresa=prefs.empresa;
    if(prefs.current_piso_id && !STATE.currentPisoId) STATE.currentPisoId=prefs.current_piso_id;
  }
  applyEmpresaUI();
  await loadAllData();
  loading(false);
}

async function loadAllData(){
  if(!STATE.user)return;
  setSyncStatus('loading','Actualizando…');
  try{
    const uid=STATE.user.id;
    const[{data:pisos},{data:habs},{data:inqs},{data:cts},{data:cbs},{data:gts},{data:hist},{data:suml}]=await Promise.all([
      sb.from('pisos').select('*').eq('user_id',uid).order('created_at'),
      sb.from('habitaciones').select('*').eq('user_id',uid).order('created_at'),
      sb.from('inquilinos').select('*').eq('user_id',uid).order('created_at'),
      sb.from('contratos').select('*').eq('user_id',uid).order('created_at'),
      sb.from('cobros').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
      sb.from('gastos').select('*').eq('user_id',uid).order('fecha_fin',{ascending:false}),
      sb.from('historico_gastos').select('*').eq('user_id',uid).order('archivado_at',{ascending:false}),
      sb.from('tipos_suml').select('*').eq('user_id',uid).order('created_at'),
    ]);
    STATE.pisos=pisos||[];STATE.habitaciones=habs||[];STATE.inquilinos=inqs||[];
    STATE.contratos=cts||[];STATE.cobros=cbs||[];STATE.gastos=gts||[];
    STATE.historicoGastos=hist||[];STATE.tiposSupl=suml||[];
    if(!STATE.tiposSupl.length)await insertDefaultSuml();
    if(STATE.currentPisoId&&!STATE.pisos.find(p=>p.id===STATE.currentPisoId))STATE.currentPisoId=null;
    if(!STATE.currentPisoId&&STATE.pisos.length)STATE.currentPisoId=STATE.pisos[0].id;
    setSyncStatus('ok','OK '+new Date().toLocaleTimeString('es'));
    updateSidebarPiso();updatePageSubtitles();
    const active=document.querySelector('.page.active');
    if(active){const page=active.id.replace('page-','');
    const renders={dashboard:renderDashboard,habitaciones:renderHabs,inquilinos:renderInquilinos,contratos:renderContratos,cobros:renderCobros,gastos:renderGastos,configurar:renderConfigPage};
    if(renders[page])renders[page]();}
  }catch(e){setSyncStatus('err','Error: '+e.message);toast('Error al cargar datos','error');console.error(e);}
}
async function insertDefaultSuml(){
  const uid=STATE.user.id;
  const rows=SUML_DEFAULTS.map(s=>({...s,user_id:uid}));
  const{data}=await sb.from('tipos_suml').insert(rows).select();
  if(data)STATE.tiposSupl=data;
}

// DB HELPERS
async function dbSave(table,payload,editId=null){
  const row={...payload,user_id:STATE.user.id};
  if(editId){const{data,error}=await sb.from(table).update(row).eq('id',editId).select().single();if(error)throw error;return data;}
  else{const{data,error}=await sb.from(table).insert(row).select().single();if(error)throw error;return data;}
}
async function dbDelete(table,id){const{error}=await sb.from(table).delete().eq('id',id);if(error)throw error;}

// PISOS
function getCurrentPiso(){return STATE.pisos.find(p=>p.id===STATE.currentPisoId)||STATE.pisos[0]||null;}
function updateSidebarPiso(){
  const p=getCurrentPiso();
  document.getElementById('sidebarPiso').innerHTML=p
    ?`<div class="piso-name">${p.nombre}</div><div class="piso-addr">${p.direccion?p.direccion.split(',')[0]:'Sin direccion'}</div>`
    :`<div class="piso-name">—</div><div class="piso-addr">Sin inmueble</div>`;
}
function updatePageSubtitles(){const p=getCurrentPiso();const nombre=p?p.nombre:'Sin inmueble';document.querySelectorAll('.current-piso-name').forEach(el=>el.textContent=nombre);}
function openModalNuevoPiso(){
  document.getElementById('modalPisoTitle').textContent='Nuevo inmueble';
  ['pisoNombre','pisoCatastral','pisoDireccion','pisoMetros','pisoNumHabs'].forEach(f=>document.getElementById(f).value='');
  document.getElementById('pisoEditId').value='';openModal('modalPiso');
}
function openModalEditarPiso(id){
  const p=STATE.pisos.find(x=>x.id===id);if(!p)return;
  document.getElementById('modalPisoTitle').textContent='Editar inmueble';
  document.getElementById('pisoNombre').value=p.nombre||'';document.getElementById('pisoCatastral').value=p.catastral||'';
  document.getElementById('pisoDireccion').value=p.direccion||'';document.getElementById('pisoMetros').value=p.metros||'';
  document.getElementById('pisoNumHabs').value=p.num_habs||'';document.getElementById('pisoEditId').value=id;
  openModal('modalPiso');
}
async function guardarPiso(){
  const nombre=v('pisoNombre').trim();if(!nombre){toast('Nombre obligatorio','error');return;}
  const payload={nombre,catastral:v('pisoCatastral'),direccion:v('pisoDireccion'),metros:v('pisoMetros')||null,num_habs:v('pisoNumHabs')||null};
  const eid=v('pisoEditId');
  try{
    const row=await dbSave('pisos',payload,eid||null);
    if(eid){const i=STATE.pisos.findIndex(x=>x.id===eid);STATE.pisos[i]=row;toast('Inmueble actualizado');}
    else{STATE.pisos.push(row);if(STATE.pisos.length===1){STATE.currentPisoId=row.id;savePrefPiso();}toast('Inmueble creado');}
    closeModal('modalPiso');renderConfigPage();updateSidebarPiso();updatePageSubtitles();
  }catch(e){toast(e.message,'error');}
}
async function eliminarPiso(id){
  if(STATE.habitaciones.some(h=>h.piso_id===id)&&!confirm('Este inmueble tiene habitaciones. ¿Eliminar igualmente?'))return;
  if(!confirm('¿Eliminar este inmueble?'))return;
  try{
    await dbDelete('pisos',id);STATE.pisos=STATE.pisos.filter(p=>p.id!==id);
    if(STATE.currentPisoId===id){STATE.currentPisoId=STATE.pisos[0]?.id||null;savePrefPiso();}
    renderConfigPage();updateSidebarPiso();updatePageSubtitles();toast('Inmueble eliminado');
  }catch(e){toast(e.message,'error');}
}
async function seleccionarPiso(id){
  STATE.currentPisoId=id;savePrefPiso();renderConfigPage();updateSidebarPiso();updatePageSubtitles();renderDashboard();
  toast('Inmueble seleccionado: '+getCurrentPiso()?.nombre);
}
function savePrefPiso(){
  if(!STATE.user)return;
  localStorage.setItem('currentPisoId_'+STATE.user.id,STATE.currentPisoId||'');
  // Upsert en Supabase (fire & forget)
  sb.from('user_prefs').upsert({user_id:STATE.user.id,current_piso_id:STATE.currentPisoId||null,empresa:STATE.empresa},{onConflict:'user_id'}).then(()=>{});
}
// EMPRESA
function applyEmpresaUI(){
  const name=STATE.empresa||'Mi empresa';
  // Sidebar logo
  const lt=document.querySelector('.logo-text');
  if(lt)lt.innerHTML=name.replace(' ','<br style="display:none">').replace(/(\S+)\s+(\S+)/,'$1 <span>$2</span>');

  const al=document.querySelector('.auth-logo');
  if(al){const parts=name.split(' ');if(parts.length>1)al.innerHTML=parts.slice(0,-1).join(' ')+' <span>'+parts[parts.length-1]+'</span>';else al.innerHTML='<span>'+name+'</span>';}

  const inp=document.getElementById('cfgEmpresaInput');
  if(inp&&inp.value!==name)inp.value=name;
}
async function saveEmpresa(){
  const inp=document.getElementById('cfgEmpresaInput');if(!inp)return;
  const val=inp.value.trim();if(!val){toast('El nombre no puede estar vacío','error');return;}
  STATE.empresa=val;
  applyEmpresaUI();
  const{error}=await sb.from('user_prefs').upsert({user_id:STATE.user.id,empresa:val,current_piso_id:STATE.currentPisoId||null},{onConflict:'user_id'});
  if(error){toast(error.message,'error');return;}
  toast('Nombre de empresa guardado');

function renderConfigPage(){const panelInm=document.getElementById('cfgpanel-inmuebles');if(panelInm?.classList.contains('active'))renderPisosGrid();}
function renderPisosGrid(){
  const grid=document.getElementById('pisosGrid');if(!grid)return;
  if(!STATE.pisos.length){grid.innerHTML='<div class="empty"><div class="empty-icon">🏠</div><div class="empty-title">Sin inmuebles</div><p>Pulsa "+ Nuevo inmueble" para annadir el primero</p></div>';return;}

  STATE.pisos.forEach(p=>{
    const numHabs=STATE.habitaciones.filter(h=>h.piso_id===p.id).length;
    const numInqs=STATE.inquilinos.filter(i=>{const h=STATE.habitaciones.find(x=>x.id===i.habitacion_id);return h&&h.piso_id===p.id&&i.estado==='activo';}).length;

      <div class="card-header"><div style="flex:1;min-width:0"><div class="card-title">${p.nombre}</div><div class="text-sm text-muted">${p.direccion||'Sin direccion'}</div></div>${isActive?'<span class="badge badge-activo">Activo</span>':''}</div>
      <div class="room-detail-row"><span class="room-detail-label">Habitaciones</span><span class="room-detail-value">${numHabs}</span></div>
      <div class="room-detail-row"><span class="room-detail-label">Inquilinos activos</span><span class="room-detail-value">${numInqs}</span></div>

      ${p.catastral?`<div class="room-detail-row"><span class="room-detail-label">Catastral</span><span class="room-detail-value text-muted">${p.catastral}</span></div>`:''}

        <button class="btn btn-danger btn-sm" onclick="eliminarPiso('${p.id}')">Eliminar</button>

function renderPisoInfo(){

  const hist=STATE.historicoGastos;
  if(!hist.length){tbody.innerHTML=`<tr><td colspan="8"><div class="empty"><div class="empty-icon">🗂</div><div class="empty-title">Historico vacio</div></div></td></tr>`;document.getElementById('historicoMob').innerHTML='';return;}
  tbody.innerHTML=hist.map(g=>{const s=getSuml(g.tipo);const arch=g.archivado_at?new Date(g.archivado_at).toLocaleDateString('es'):'—';return `<tr><td><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:3px;background:${s.color}"></span>${s.icono} ${g.tipo}</span></td><td class="text-muted">${g.proveedor||'—'}</td><td class="text-muted">${fmtD(g.fecha_inicio)}</td><td class="text-muted">${fmtD(g.fecha_fin)}</td><td class="font-bold">€${fmt(g.importe)}</td><td class="text-muted">${g.num_factura||'—'}</td><td class="text-muted">${g.motivo||'—'}</td><td class="text-muted text-sm">${arch}</td></tr>`;}).join('');
  document.getElementById('historicoMob').innerHTML=hist.map(g=>{const s=getSuml(g.tipo);return `<div class="mob-card"><div class="mob-card-header"><div><div class="mob-card-name">${s.icono} ${g.tipo}${g.proveedor?' · '+g.proveedor:''}</div><div class="mob-card-sub">${fmtD(g.fecha_inicio)} → ${fmtD(g.fecha_fin)}</div></div><span class="badge badge-pagado">✓</span></div><div class="mob-card-rows"><span class="mob-card-pill">💶 <strong>€${fmt(g.importe)}</strong></span>${g.num_factura?`<span class="mob-card-pill">${g.num_factura}</span>`:''}</div></div>`;}).join('');
}
function renderGantt(){
  const container=document.getElementById('ganttContainer');if(!container)return;
  const todas=[...STATE.gastos,...STATE.historicoGastos];const porTipo={};
  todas.forEach(g=>{if(!g.fecha_inicio||!g.fecha_fin)return;const prev=porTipo[g.tipo];if(!prev||(g.fecha_fin>prev.fecha_fin))porTipo[g.tipo]=g;});
  const tipos=Object.keys(porTipo);
  if(!tipos.length){container.innerHTML='<div class="text-muted text-sm">Sin datos de suministros con fechas.</div>';return;}
  let minDate=new Date(porTipo[tipos[0]].fecha_inicio),maxDate=new Date(porTipo[tipos[0]].fecha_fin);
  tipos.forEach(t=>{const s=new Date(porTipo[t].fecha_inicio),e=new Date(porTipo[t].fecha_fin);if(s<minDate)minDate=s;if(e>maxDate)maxDate=e;});
  minDate=new Date(minDate.getTime()-15*86400000);maxDate=new Date(maxDate.getTime()+15*86400000);
  const totalMs=maxDate-minDate;const labelW=100,margin={top:20,right:20,bottom:38,left:labelW};
  const rowH=44;const chartH=tipos.length*rowH;const svgW=Math.max(500,(container.clientWidth||600)-40);const svgH=chartH+margin.top+margin.bottom;const barW=svgW-margin.left-margin.right;
  const xOf=d=>((new Date(d)-minDate)/totalMs)*barW;
  const tickDates=[];const cur=new Date(minDate);cur.setDate(1);
  while(cur<=maxDate){tickDates.push(new Date(cur));cur.setMonth(cur.getMonth()+1);}
  let svg=`<svg class="gantt-svg" width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg">`;
  tipos.forEach((t,i)=>{const y=margin.top+i*rowH;if(i%2===0)svg+=`<rect x="${margin.left}" y="${y}" width="${barW}" height="${rowH}" fill="rgba(255,255,255,0.018)" rx="0"/>`;});
  tickDates.forEach(d=>{const x=margin.left+xOf(d.toISOString().slice(0,10));if(x<margin.left||x>margin.left+barW)return;svg+=`<line x1="${x}" y1="${margin.top}" x2="${x}" y2="${margin.top+chartH}" stroke="#2a2a38" stroke-width="1"/>`;const lbl=d.toLocaleDateString('es',{month:'short',year:'2-digit'}).replace('. ','/').toUpperCase();svg+=`<text x="${x}" y="${margin.top+chartH+18}" text-anchor="middle" font-size="9" fill="#8888a8" font-family="DM Sans,sans-serif">${lbl}</text>`;});
  const hoyX=margin.left+xOf(new Date().toISOString().slice(0,10));
  if(hoyX>=margin.left&&hoyX<=margin.left+barW){svg+=`<line x1="${hoyX}" y1="${margin.top}" x2="${hoyX}" y2="${margin.top+chartH}" stroke="#f76a6a" stroke-width="1.5" stroke-dasharray="4,3"/>`;svg+=`<text x="${hoyX}" y="${margin.top-5}" text-anchor="middle" font-size="9" fill="#f76a6a" font-family="DM Sans,sans-serif">HOY</text>`;}
  tipos.forEach((t,i)=>{const g=porTipo[t];const s=getSuml(t);const y=margin.top+i*rowH;const barY=y+10;const barH=rowH-20;const x1=margin.left+xOf(g.fecha_inicio);const x2=margin.left+xOf(g.fecha_fin);const barLen=Math.max(x2-x1,4);const gId='g_'+t.replace(/\W/g,'_');svg+=`<defs><linearGradient id="${gId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${s.color}" stop-opacity="0.9"/><stop offset="100%" stop-color="${s.color}" stop-opacity="0.5"/></linearGradient></defs>`;svg+=`<text x="${margin.left-6}" y="${barY+barH/2+4}" text-anchor="end" font-size="11" fill="#e8e8f0" font-family="DM Sans,sans-serif" font-weight="500">${s.icono} ${t}</text>`;svg+=`<rect x="${x1}" y="${barY}" width="${barLen}" height="${barH}" fill="url(#${gId})" rx="5"/>`;if(barLen>70){svg+=`<text x="${x1+6}" y="${barY+barH/2+4}" font-size="9" fill="rgba(0,0,0,0.75)" font-family="DM Sans,sans-serif">${fmtD(g.fecha_inicio)}</text>`;svg+=`<text x="${x2-6}" y="${barY+barH/2+4}" text-anchor="end" font-size="9" fill="rgba(0,0,0,0.75)" font-family="DM Sans,sans-serif">${fmtD(g.fecha_fin)}</text>`;}svg+=`<text x="${x1+barLen/2}" y="${barY-3}" text-anchor="middle" font-size="9" fill="${s.color}" font-family="DM Sans,sans-serif" font-weight="600">€${fmt(g.importe)}</text>`;});
  svg+='</svg>';container.innerHTML=svg;
}
function renderGastos(){renderGastosStats();renderGastosFilters();if(gastosActiveTab==='pendientes')renderGastosTabla();else if(gastosActiveTab==='historico')renderHistorico();else if(gastosActiveTab==='grafico')renderGantt();}

// COBROS ALQUILER
async function crearCobrosAlquiler(){
  const elegibles=STATE.habitaciones.filter(h=>h.estado==='ocupada'&&STATE.inquilinos.find(i=>i.habitacion_id===h.id&&i.estado==='activo'));
  if(!elegibles.length){toast('No hay habitaciones ocupadas con inquilino activo','error');return;}
  const hoy=new Date();const mes=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0');const fecha=mes+'-05';let rows=[];
  elegibles.forEach(h=>{const inq=STATE.inquilinos.find(i=>i.habitacion_id===h.id&&i.estado==='activo');const existe=STATE.cobros.find(co=>co.inquilino_id===inq.id&&co.habitacion_id===h.id&&co.mes===mes&&co.concepto==='Alquiler');if(!existe)rows.push({user_id:STATE.user.id,inquilino_id:inq.id,habitacion_id:h.id,concepto:'Alquiler',mes,importe:h.precio,metodo:'Transferencia',estado:'pendiente',fecha,notas:'Generado automaticamente'});});
  if(!rows.length){toast('Ya existen cobros de alquiler para este mes','error');return;}
  const{data,error}=await sb.from('cobros').insert(rows).select();if(error){toast(error.message,'error');return;}
  STATE.cobros.unshift(...(data||[]));renderCobros();toast(rows.length+' cobro(s) de alquiler creados para '+mes);
}

// COBROS SUMINISTROS PRORATEADOS
async function crearCobrosProrateados(){
  const pendientes=STATE.gastos.filter(g=>!g.pagada);if(!pendientes.length){toast('No hay facturas pendientes de prorrateo','error');return;}
  const elegibles=STATE.habitaciones.filter(h=>h.estado==='ocupada'&&STATE.inquilinos.find(i=>i.habitacion_id===h.id&&i.estado==='activo'));if(!elegibles.length){toast('No hay habitaciones ocupadas con inquilino activo','error');return;}
  const total=pendientes.reduce((s,g)=>s+Number(g.importe),0);const cuota=Math.round((total/elegibles.length)*100)/100;
  const hoy=new Date();const mes=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0');const fecha=hoy.toISOString().split('T')[0];
  const cobroRows=elegibles.map(h=>{const inq=STATE.inquilinos.find(i=>i.habitacion_id===h.id&&i.estado==='activo');const detalle=pendientes.map(g=>`${getSuml(g.tipo).icono}${g.tipo} ${fmtD(g.fecha_inicio)}→${fmtD(g.fecha_fin)} €${fmt(Number(g.importe)/elegibles.length)}`).join(' | ');return{user_id:STATE.user.id,inquilino_id:inq.id,habitacion_id:h.id,concepto:'Suministros',mes,importe:cuota,metodo:'Transferencia',estado:'pendiente',fecha,notas:'Prorrateo: '+detalle};});
  const histRows=pendientes.map(g=>({user_id:STATE.user.id,gasto_id_origen:g.id,tipo:g.tipo,fecha_inicio:g.fecha_inicio,fecha_fin:g.fecha_fin,importe:g.importe,proveedor:g.proveedor,num_factura:g.num_factura,notas:g.notas,motivo:'Prorrateo'}));
  try{
    const{data:cbData,error:cbErr}=await sb.from('cobros').insert(cobroRows).select();if(cbErr)throw cbErr;
    const{data:hData,error:hErr}=await sb.from('historico_gastos').insert(histRows).select();if(hErr)throw hErr;
    const ids=pendientes.map(g=>g.id);const{error:upErr}=await sb.from('gastos').update({pagada:true}).in('id',ids);if(upErr)throw upErr;
    STATE.cobros.unshift(...(cbData||[]));STATE.historicoGastos.unshift(...(hData||[]));
    pendientes.forEach(g=>{const i=STATE.gastos.findIndex(x=>x.id===g.id);if(i>=0)STATE.gastos[i].pagada=true;});
    renderGastos();renderCobros();toast(elegibles.length+' cobro(s) de €'+fmt(cuota)+' — Facturas archivadas');
  }catch(e){toast(e.message,'error');}
}

// DASHBOARD
function renderDashboard(){
  const th=STATE.habitaciones.length;const oc=STATE.habitaciones.filter(h=>h.estado==='ocupada').length;const li=STATE.habitaciones.filter(h=>h.estado==='libre').length;const pct=th?Math.round(oc/th*100):0;
  const ia=STATE.inquilinos.filter(i=>i.estado==='activo').length;const mo=STATE.inquilinos.filter(i=>i.estado==='moroso').length;
  const mesH=new Date().toISOString().slice(0,7);const ing=STATE.cobros.filter(c=>c.estado==='pagado'&&c.mes===mesH).reduce((s,c)=>s+Number(c.importe),0);
  const pend=STATE.cobros.filter(c=>c.estado==='pendiente').length;const gasto=STATE.gastos.filter(g=>!g.pagada).reduce((s,g)=>s+Number(g.importe),0);
  document.getElementById('dashboardStats').innerHTML=`<div class="stat-card"><div class="stat-value stat-accent">${th}</div><div class="stat-label">Habitaciones</div></div><div class="stat-card"><div class="stat-value stat-yellow">${oc} <span style="font-size:13px;color:var(--text2)">${pct}%</span></div><div class="stat-label">Ocupadas</div></div><div class="stat-card"><div class="stat-value stat-green">${li}</div><div class="stat-label">Libres</div></div><div class="stat-card"><div class="stat-value">${ia}</div><div class="stat-label">Inquilinos activos</div></div><div class="stat-card"><div class="stat-value stat-green">€${fmt(ing)}</div><div class="stat-label">Cobrado este mes</div></div><div class="stat-card"><div class="stat-value stat-red">€${fmt(gasto)}</div><div class="stat-label">Facturas pendientes</div></div><div class="stat-card"><div class="stat-value ${ing-gasto>=0?'stat-green':'stat-red'}">€${fmt(ing-gasto)}</div><div class="stat-label">Beneficio neto</div></div>${mo>0?`<div class="stat-card"><div class="stat-value stat-red">${mo}</div><div class="stat-label">Morosos</div></div>`:''}${pend>0?`<div class="stat-card"><div class="stat-value stat-yellow">${pend}</div><div class="stat-label">Cobros pendientes</div></div>`:''}`;
  const grid=document.getElementById('dashboardHabs');const habsPiso=STATE.habitaciones.filter(h=>!STATE.currentPisoId||h.piso_id===STATE.currentPisoId);const pisoActivo=getCurrentPiso();
  if(!habsPiso.length){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px 20px"><div style="font-size:40px;margin-bottom:10px">🏠</div><div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700">${pisoActivo?pisoActivo.nombre:'Sin inmueble'}</div>${pisoActivo&&pisoActivo.direccion?`<div style="font-size:13px;color:var(--text2);margin-top:4px">${pisoActivo.direccion}</div>`:''}</div>`;return;}
  grid.innerHTML=habsPiso.map(h=>{const inq=STATE.inquilinos.find(i=>i.habitacion_id===h.id&&i.estado==='activo');const uc=STATE.cobros.find(c=>c.habitacion_id===h.id);return `<div class="card" style="cursor:pointer" onclick="showPage('habitaciones')"><div class="card-header"><div class="card-title">${h.nombre}</div><span class="badge badge-${h.estado}">● ${cap(h.estado)}</span></div><div class="room-detail-row"><span class="room-detail-label">Renta</span><span class="room-detail-value text-green">€${h.precio}/mes</span></div>${inq?`<div class="room-detail-row"><span class="room-detail-label">Inquilino</span><span class="room-detail-value">👤 ${inq.nombre}</span></div>`:''} ${uc?`<div class="room-detail-row"><span class="room-detail-label">Ultimo cobro</span><span class="room-detail-value"><span class="badge badge-${uc.estado}" style="font-size:10px">${uc.estado}</span></span></div>`:''}</div>`;}).join('');
}

// INIT
document.addEventListener('DOMContentLoaded',async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session){STATE.user=session.user;bootApp();}
  else{loading(false);document.getElementById('authScreen').style.display='flex';}
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){document.getElementById('mainApp').style.display='none';document.getElementById('authScreen').style.display='flex';loading(false);}
    if(event==='TOKEN_REFRESHED'&&session){STATE.user=session.user;}
  });
  document.getElementById('authPassword').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
});
